  <script>
    let records = [];
    let loaded = false;

    async function loadData() {
      try {
        const res = await fetch('results_data.json');
        if (!res.ok) throw new Error('Could not load data');
        records = await res.json();
        loaded = true;
      } catch (err) {
        document.getElementById('results').innerHTML = '<div class="error">Unable to load results data. Check that <strong>results_data.json</strong> is present.</div>';
      }
    }

    function createError(message) {
      return '<div class="error">' + message + '</div>';
    }

    function search() {
      const input = document.getElementById('rollInput');
      const btn = document.getElementById('searchBtn');
      const resultsDiv = document.getElementById('results');
      const statsDiv = document.getElementById('stats');
      const roll = input.value.trim();

      if (!roll) {
        resultsDiv.innerHTML = createError('Please enter a roll number');
        statsDiv.textContent = '';
        return;
      }

      if (!loaded) {
        resultsDiv.innerHTML = createError('Data is still loading. Try again in a moment.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Searching...';
      resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

      const matches = records.filter(r => String(r.roll).includes(roll));
      if (!matches.length) {
        resultsDiv.innerHTML = createError('No student found with roll number "' + roll + '"');
        statsDiv.textContent = '';
      } else if (matches.length === 1) {
        resultsDiv.innerHTML = showSingleResult(matches[0]);
        statsDiv.textContent = '';
      } else {
        resultsDiv.innerHTML = showMultiResults(matches);
        statsDiv.textContent = matches.length + ' results found';
      }

      btn.disabled = false;
      btn.textContent = 'Search';
    }

    function showSingleResult(r) {
      return `
        <div class="result-card">
          <div class="result-header">
            <span class="roll-number">Roll No: ${r.roll}</span>
            <span class="rank-badge">Rank #${r.rank}</span>
          </div>
          <div class="marks-display">
            <span class="marks-number">${r.marks}</span>
            <span class="marks-label">/ 100</span>
          </div>
          <div class="rank-info">${r.rank === 1 ? '🥇 Top Rank!' : 'Position: ' + r.rank + ' out of 14056 students'}</div>
        </div>
      `;
    }

    function showMultiResults(data) {
      let html = '<div class="error">Multiple matches found. Select one:</div>';
      data.slice(0, 25).forEach(r => {
        html += `
          <div class="multi-result" onclick="selectResult('${r.roll}')">
            <span class="roll">Roll: ${r.roll}</span>
            <div>
              <span class="marks">${r.marks} marks</span>
              <span class="rank"> • Rank #${r.rank}</span>
            </div>
          </div>
        `;
      });
      return html;
    }

    function selectResult(roll) {
      document.getElementById('rollInput').value = roll;
      search();
    }

    document.getElementById('rollInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') search();
    });

    loadData();
  </script>
